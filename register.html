<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนพนักงานใหม่ - Hunsa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 {
            color: #1a365d;
            margin-top: 0;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
        }
        p.subtitle {
            color: #718096;
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .mb-3 { /* เปลี่ยนชื่อเพื่อให้ตรงกับในฟอร์ม */
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 600;
            font-size: 14px;
        }
        /* 🛠️ แก้ไขตรงนี้: เพิ่ม input[type="tel"] เข้าไปด้วย เพื่อให้กาง 100% เท่ากัน */
        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #f8fafc;
            transition: all 0.2s;
        }
        input[type="text"]:focus, input[type="tel"]:focus {
            outline: none;
            border-color: #3182ce;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }
        input[readonly] {
            background-color: #e2e8f0;
            color: #4a5568;
            cursor: not-allowed;
        }
        /* 🛠️ แก้ไขตรงนี้: ปรับคลาสปุ่มให้ตรงกับที่คุณเรียกใช้ใน HTML (btn-success) */
        .btn-success {
            width: 100%;
            padding: 14px;
            background-color: #2f855a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-success:hover {
            background-color: #22543d;
        }
        #loading {
            text-align: center;
            color: #3182ce;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ลงทะเบียนพนักงานใหม่</h2>
    <p class="subtitle">ระบบคิวรถ Hunsa Driver</p>
    
    <div id="loading">⏳ กำลังดึงรหัส LINE User ID ของคุณ...</div>

    <form id="registerForm" onsubmit="submitForm(event)">
        <div class="mb-3">
            <label for="driverName" class="form-label" style="font-weight: bold;">👤 ชื่อ - นามสกุลจริง</label>
            <input type="text" class="form-control" id="driverName" placeholder="เช่น นายสมชาย ใจดี" required>
        </div>
        
        <div class="mb-3">
            <label for="driverPhone" class="form-label" style="font-weight: bold;">📞 เบอร์โทรศัพท์มือถือ</label>
            <input type="tel" class="form-control" id="driverPhone" placeholder="เช่น 0812345678" pattern="[0-9]{9,10}" title="กรุณากรอกเบอร์โทรศัพท์เป็นตัวเลข 9-10 หลัก" required>
        </div>

        <div class="mb-3">
            <label for="lineUid" class="form-label" style="font-weight: bold;">🔑 รหัส LINE User ID (ระบบดึงให้อัตโนมัติ)</label>
            <input type="text" class="form-control" id="lineUid" readonly required>
        </div>

        <button type="submit" class="btn btn-success" style="font-weight: bold;">🚀 ส่งข้อมูลลงทะเบียนระบบคิวรถ</button>
    </form>
</div>

<script>
    // คงสคริปต์ LIFF เดิมของคุณไว้ได้เลยครับ...
    async function initLiff() {
        try {
            await liff.init({ liffId: "2010148491-zYBksiiv" });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                document.getElementById('lineUid').value = profile.userId;
                document.getElementById('loading').style.display = 'none';
            } else {
                liff.login();
            }
        } catch (error) {
            console.error("LIFF Init Error:", error);
            document.getElementById('loading').innerText = "❌ เกิดข้อผิดพลาดในการดึงข้อมูล LINE";
        }
    }
    initLiff();

    async function submitForm(event) {
        event.preventDefault();
        const name = document.getElementById('driverName').value.trim();
        const phone = document.getElementById('driverPhone').value.trim();
        const lineId = document.getElementById('lineUid').value.trim();
        
        if (!name || !phone || !lineId) {
            alert("กรุณากรอกข้อมูลให้ครบถ้วนครับ");
            return;
        }

        const googleScriptUrl = `https://script.google.com/macros/s/AKfycbxq0ARfECWNpsFiKNxjyXAtv7zSk-GpkMDQVWI1z8LGsYbCEU3A2gyXReD-HWmus-yI/exec?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&line_id=${encodeURIComponent(lineId)}`;

        try {
            const response = await fetch(googleScriptUrl);
            const result = await response.json();
            
            if (result.status === "duplicate") {
                alert("⚠️ ขออภัยครับ! คุณเคยลงทะเบียนในระบบคิวรถ Hunsa เรียบร้อยแล้ว ไม่ต้องลงทะเบียนซ้ำครับ");
            } else if (result.status === "success") {
                alert("🎉 ลงทะเบียนสำเร็จเรียบร้อยแล้วครับ! ระบบจะปิดหน้าต่างนี้โดยอัตโนมัติ กรุณารอแอดมินกล้าอนุมัติสิทธิ์นะครับ");
            } else {
                alert("❌ เกิดข้อผิดพลาดทางเทคนิค กรุณาแจ้งแอดมินกล้าครับ");
            }
            
            setTimeout(() => {
                if (typeof liff !== 'undefined' && liff.closeWindow) {
                    liff.closeWindow();
                }
            }, 500);
            
        } catch (error) {
            console.error("Submit Error:", error);
            if (typeof liff !== 'undefined' && liff.closeWindow) {
                liff.closeWindow();
            }
        }
    }
</script>

</body>
</html>
